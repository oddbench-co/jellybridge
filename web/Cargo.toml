[package]
name = "jellybridge-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

# The website is its own workspace: the app's workspace at the repository root does not build it,
# and building it never touches the app.
[workspace]

[dependencies]
askama = "0.16.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
# Pages are rendered once at startup and compressed there, never per request.
brotli = "9.0.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
serde_json = "1"

[build-dependencies]
brotli = "9.0.0"
flate2 = "1.1.10"
sha2 = "0.11.0"

# Small, fast release binary: whole-program optimisation, one codegen unit, no debug symbols.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
