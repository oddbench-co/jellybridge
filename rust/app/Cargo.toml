[package]
name = "jellybridge-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[features]
default = ["renderer-femtovg"]
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-skia-opengl = ["slint/renderer-skia-opengl"]

[dependencies]
jellybridge-vertical-slice = { path = "../vertical-slice", default-features = false }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "query", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "raw-window-handle-06", "accessibility", "compat-1-2"] }
thiserror = "=2.0.17"
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["fmt", "env-filter"] }
url = "=2.5.7"

[build-dependencies]
slint-build = "=1.17.1"

[dev-dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["renderer-software"] }

[package.metadata.packager]
product-name = "JellyBridge"
identifier = "dev.nk.jellybridge"
category = "Video"
icons = [
    "../../src/main/resources/icon.png",
    "../../src/main/resources/icon.icns",
]
formats = ["app", "dmg", "deb", "appimage"]

[package.metadata.packager.macos]
minimum-system-version = "13.0"

[[bin]]
name = "jellybridge"
path = "src/main.rs"
