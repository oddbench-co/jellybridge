[package]
name = "jellybridge-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
base64 = "=0.22.1"
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "wayland", "x11", "accesskit", "default_fonts"] }
egui = "=0.36.2"
futures-util = "=0.3.31"
getrandom = { version = "=0.3.4", features = ["std"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "=0.2.189"
libloading = "=0.8.9"
raw-window-handle = "=0.6.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "query", "stream"] }
resvg = { version = "=0.47.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["fmt", "env-filter"] }
url = "=2.5.7"

# The desktop portal's file chooser (Profile's "Add Image"); zbus already
# comes in through the accessibility stack.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

# Windows' own file dialog for "Add Image"; windows-sys already comes in
# through winit.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs"] }

[package.metadata.packager]
product-name = "JellyBridge"
identifier = "dev.nk.jellybridge"
category = "Video"
icons = [
    "assets/icon.png",
    "assets/icon.icns",
]
formats = ["app", "dmg", "deb", "appimage"]

[package.metadata.packager.macos]
minimum-system-version = "13.0"

[[bin]]
name = "jellybridge"
path = "src/main.rs"
